version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: lablogbook-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lablogbook
      MYSQL_USER: lablogbook_user
      MYSQL_PASSWORD: lablogbook_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - lablogbook-network

  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lablogbook-backend
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/lablogbook?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - JWT_SECRET=your-secret-key-here-make-it-long-and-secure-for-production
      - JWT_EXPIRATION=86400000
      - SPRING_WEB_CORS_ALLOWED_ORIGINS=http://localhost:3000
      - SERVER_PORT=8080
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - lablogbook-network

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lablogbook-frontend
    environment:
      - REACT_APP_API_URL=http://localhost:8080/api
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - lablogbook-network

volumes:
  mysql_data:

networks:
  lablogbook-network:
    driver: bridge 