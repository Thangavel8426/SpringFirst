services:
  - type: web
    name: lab-experiment-logbook-backend
    env: java
    buildCommand: ./mvnw clean install -DskipTests
    startCommand: java -jar target/lab-experiment-logbook-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: SPRING_DATASOURCE_URL
        value: "jdbc:mysql://gondola.proxy.rlwy.net:24482/railway?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      - key: SPRING_DATASOURCE_USERNAME
        value: "root"
      - key: SPRING_DATASOURCE_PASSWORD
        value: "clCBnwidlucjnLmydCKnaqmfQDLZTBzO"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: SPRING_WEB_CORS_ALLOWED_ORIGINS
        value: "https://your-frontend-domain.vercel.app"
      - key: SERVER_PORT
        value: "8080" 